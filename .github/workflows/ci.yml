name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentrimesh
          POSTGRES_PASSWORD: sentrimesh
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentrimesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration tests drop/recreate this exact database at the
      # start of the test session (tests/conftest.py) — never point this
      # at anything you don't want wiped.
      DATABASE_URL: postgresql+asyncpg://sentrimesh:sentrimesh@localhost:5432/sentrimesh_test
      REDIS_URL: redis://localhost:6379/1
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: CiTestPass123!
      JWT_SECRET: ci-only-secret-never-use-in-production
      ENABLE_REAL_RESPONSE_EXECUTION: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
